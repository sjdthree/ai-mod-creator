# cargo-about config for the THIRD_PARTY_LICENSES*.html files bundled with the desktop app
# (generated by scripts/stage_bundle.sh and build_windows.ps1). Keep `accepted` in step with the
# allow list in /deny.toml.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "Unlicense",
    "CC0-1.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
