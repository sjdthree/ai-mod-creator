# cargo-deny policy: run `cargo deny check licenses` (CI does) so a dependency with an incompatible
# license can't slip into the Apache-2.0 engine. Keep this list permissive; adding a copyleft license
# here is a licensing decision, not a build fix.
[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "Unlicense",
    "CC0-1.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    # File-level copyleft (desktop app's HTML/CSS stack via Tauri): fine to ship in binaries
    # unmodified; any modification to those files must be published.
    "MPL-2.0",
]

[bans]
multiple-versions = "allow"

[advisories]
version = 2
yanked = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
