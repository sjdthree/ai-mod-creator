[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/sjdthree/ai-mod-creator"
authors = ["sjdthree"]

[workspace.dependencies]
# shared third-party deps, pinned once for reproducibility
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
jsonschema = { version = "0.60", default-features = false }
sha2 = "0.11"
ulid = "1"
png = "0.17"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
anyhow = "1"
ureq = "3"

# internal crates
amc-core = { path = "crates/amc-core" }
amc-schema = { path = "crates/amc-schema" }
amc-state = { path = "crates/amc-state" }
amc-validator = { path = "crates/amc-validator" }
amc-generator = { path = "crates/amc-generator" }
amc-build = { path = "crates/amc-build" }
amc-verify = { path = "crates/amc-verify" }
amc-launch = { path = "crates/amc-launch" }
amc-intent = { path = "crates/amc-intent" }
amc-bench = { path = "crates/amc-bench" }

[profile.release]
lto = "thin"
